<div class="container mt-5" style="max-width: 400px;">
  <div class="card shadow p-4">
    <h2 class="text-center mb-4">Cadastro</h2>
    <form (ngSubmit)="onRegister()">
      <div class="mb-3">
        <label class="form-label">Código:</label>
        <input type="text" class="form-control" [(ngModel)]="user.code" name="code" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Login:</label>
        <input type="text" class="form-control" [(ngModel)]="user.login" name="login" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Senha:</label>
        <input type="password" class="form-control" [(ngModel)]="user.passwordHash" name="passwordHash" required />
      </div>
      <button type="submit" class="btn btn-success w-100">Cadastrar</button>
    </form>
    <p class="mt-3 text-center">Já tem uma conta? <a routerLink="/login">Faça Login</a></p>
  </div>
</div>
