<div class="container-fluid">
  <h2 class="mb-4">Usuários</h2>

  <div class="card mb-4 shadow-sm">
    <div class="card-body">
      <h5 class="card-title">Novo Usuário</h5>
      <div class="row g-2 align-items-center">
        <div class="col-md-2"><input type="text" class="form-control" [(ngModel)]="newUser.code" placeholder="Código" /></div>
        <div class="col-md-3"><input type="text" class="form-control" [(ngModel)]="newUser.login" placeholder="Login" /></div>
        <div class="col-md-3"><input type="password" class="form-control" [(ngModel)]="newUser.passwordHash" placeholder="Senha" /></div>
        <div class="col-md-2 form-check ms-3">
          <input type="checkbox" class="form-check-input" id="ativoUser" [(ngModel)]="newUser.isActive" />
          <label class="form-check-label" for="ativoUser">Ativo</label>
        </div>
        <div class="col-md-1"><button class="btn btn-primary w-100" (click)="create()">Salvar</button></div>
      </div>
    </div>
  </div>

  <div class="mb-3 w-25">
    <select class="form-select" [(ngModel)]="statusFilter" (change)="applyFilter()">
      <option value="all">Todos os Status</option>
      <option value="active">Somente Ativos</option>
      <option value="inactive">Somente Inativos</option>
    </select>
  </div>

  <div class="card shadow-sm">
    <table class="table table-striped table-hover mb-0">
      <thead class="table-dark">
        <tr><th>Login</th><th>Status</th><th>Ações</th></tr>
      </thead>
      <tbody>
        <!-- O | async obriga o Angular a atualizar o DOM no exato instante em que a API responde -->
        <tr *ngFor="let u of users$ | async">
          <td>{{ u.login }}</td>
          <td><span class="badge" [ngClass]="u.isActive ? 'bg-success' : 'bg-danger'">{{ u.isActive ? 'ATIVO' : 'INATIVO' }}</span></td>
          <td><button class="btn btn-sm btn-outline-primary" (click)="startEdit(u)">Editar</button></td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="card mt-4 border-primary" *ngIf="editingUser">
    <div class="card-body bg-light">
      <h5 class="text-primary">Editar Usuário (ID: {{ editingUserId }})</h5>
      <div class="row g-2 mt-2 align-items-center">
        <div class="col-md-6">
          <input type="password" class="form-control" [(ngModel)]="editingUser.passwordHash" placeholder="Nova Senha (deixe em branco para não alterar)" />
        </div>
        <div class="col-md-6">
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="editAtivo" [(ngModel)]="editingUser.isActive" />
            <label class="form-check-label" for="editAtivo">Ativo</label>
          </div>
        </div>
      </div>
      <div class="mt-3">
        <button class="btn btn-success me-2" (click)="update()">Salvar</button>
        <button class="btn btn-secondary" (click)="cancelEdit()">Cancelar</button>
      </div>
    </div>
  </div>
</div>
